name: build-motorola-kernel

on:
  workflow_dispatch:

jobs:
  build:
    # To use a self-hosted Kali runner instead, change this line to:
    # runs-on: [self-hosted, linux, kali]
    # and remove the container block below.
    # To revert to the previous ubuntu runner, change this to:
    # runs-on: ubuntu-22.04
    # and remove the container block below.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    # Run the job inside a Kali Linux container
    container:
      image: kalilinux/kali-rolling
      options: --privileged

    steps:
      - name: Checkout (workflow repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kali dependencies and toolchain
        run: |
          # Install required Kali packages and Android kernel build toolchain
          # Target: clang 12.0.5 and lld 12.0.5 (matching build host)
          export DEBIAN_FRONTEND=noninteractive
          
          apt-get update
          
          # Install base build dependencies and Kali-specific tools
          # Core packages (required)
          apt-get install -y --no-install-recommends \
            debos bmap-tools f2fs-tools python3-distutils qemu-utils parted \
            squashfs-tools rsync ca-certificates curl git golang-go \
            build-essential make pkg-config libssl-dev bc \
            flex bison libncurses-dev zlib1g-dev jq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          
          # Optional cross-compile tools (may not be in all Kali repos)
          apt-get install -y --no-install-recommends gcc-arm-none-eabi || echo "gcc-arm-none-eabi not available, skipping"
          
          # Attempt to install clang-12 and lld-12 specifically
          echo "Attempting to install clang-12 and lld-12..."
          if apt-get install -y --no-install-recommends clang-12 lld-12; then
            echo "Successfully installed clang-12 and lld-12"
          else
            echo "WARNING: clang-12 or lld-12 not available in kali-rolling repositories"
            echo "Falling back to latest clang and lld versions"
            echo "This may cause version mismatch with expected clang 12.0.5 / lld 12.0.5"
            apt-get install -y --no-install-recommends clang lld
          fi
          
          # Verify toolchain installation
          echo "Checking installed toolchain versions:"
          if command -v clang-12 &>/dev/null; then
            clang-12 --version
            # Create symlinks if needed
            if [ -x /usr/bin/clang++-12 ]; then
              update-alternatives --install /usr/bin/clang clang /usr/bin/clang-12 100 || true
              update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-12 100 || true
            fi
          else
            clang --version || echo "WARNING: clang not found"
          fi
          
          if command -v lld-12 &>/dev/null; then
            lld-12 --version
            update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/lld-12 100 || true
          else
            lld --version || echo "WARNING: lld not found"
          fi
          
          # Alternative: Use prebuilt LLVM toolchain with exact version
          # If you need exactly clang 12.0.5 / lld 12.0.5 (build c935d99d7cf...):
          # Uncomment and adjust the following lines:
          #
          # LLVM_VERSION="12.0.5"
          # LLVM_TARBALL_URL="https://example.com/path/to/clang+llvm-12.0.5-x86_64-linux-gnu.tar.xz"
          # curl -L -o /tmp/llvm-toolchain.tar.xz "$LLVM_TARBALL_URL"
          # mkdir -p /opt/llvm-toolchain
          # tar -xf /tmp/llvm-toolchain.tar.xz -C /opt/llvm-toolchain --strip-components=1
          # export PATH="/opt/llvm-toolchain/bin:$PATH"
          # export LD_LIBRARY_PATH="/opt/llvm-toolchain/lib:$LD_LIBRARY_PATH"
          # clang --version
          # lld --version

      - name: Clone Motorola kernel at tag
        run: |
          git clone --depth 1 --branch MMI-T1TGNS33.60-41-2-7 https://github.com/MotorolaMobilityLLC/kernel-msm.git upstream-kernel

      - name: Prepare linker wrapper
        run: |
          mkdir -p ~/tmp-ld
          if [ -x /usr/bin/aarch64-linux-gnu-ld ]; then
            ln -sf /usr/bin/aarch64-linux-gnu-ld ~/tmp-ld/aarch64-linux-gnu-ld
          elif command -v ld.lld >/dev/null 2>&1; then
            ln -sf "$(command -v ld.lld)" ~/tmp-ld/aarch64-linux-gnu-ld
          fi
          export PATH=~/tmp-ld:$PATH

      - name: Provide device kernel (from repo or releases)
        id: provide_kernel
        run: |
          mkdir -p upstream-kernel/out/device-kernel
          if [ -f "./device-kernel/device-kernel.img" ]; then
            echo "Found device kernel in repo at ./device-kernel/device-kernel.img"
            cp ./device-kernel/device-kernel.img upstream-kernel/out/device-kernel/device-kernel.img
            echo "source=repo" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Looking for release asset device-kernel.img"
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          ASSET_URL=$(curl -s "$API_URL" | jq -r '.assets[] | select(.name == "device-kernel.img") | .url' || true)
          if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
            echo "Downloading release asset..."
            curl -L -H "Accept: application/octet-stream" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o upstream-kernel/out/device-kernel/device-kernel.img "$ASSET_URL"
            echo "source=release" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "No device kernel provided (repo or release). Continuing without it." >> $GITHUB_OUTPUT

      - name: Build kernel (Image.gz, dtbs, modules)
        run: |
          cd upstream-kernel
          export PATH=~/tmp-ld:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) O=out Image.gz dtbs modules 2>&1 | tee build.log || true

      - name: Upload build.log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: upstream-kernel/build.log

      - name: Upload build artifacts (out directory)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: upstream-kernel/out

      - name: Upload provided device kernel (if present)
        if: steps.provide_kernel.outputs.source != ''
        uses: actions/upload-artifact@v4
        with:
          name: device-kernel
          path: upstream-kernel/out/device-kernel/device-kernel.imgEOF
