name: build-motorola-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Checkout (workflow repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libncurses-dev zlib1g-dev \
            git curl jq python3 python3-distutils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld llvm \
            ccache

      - name: Cache ccache (kernel build)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-kernel-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: ccache-kernel-${{ runner.os }}-

      - name: Clone Motorola kernel at tag
        run: |
          git clone --depth 1 --branch MMI-T1TGNS33.60-41-2-7 https://github.com/MotorolaMobilityLLC/kernel-msm.git upstream-kernel

      - name: Set up linker and toolchain PATH
        run: |
          mkdir -p "$HOME/tmp-ld"
          if [ -x /usr/bin/aarch64-linux-gnu-ld ]; then
            ln -sf /usr/bin/aarch64-linux-gnu-ld "$HOME/tmp-ld/aarch64-linux-gnu-ld"
          elif command -v ld.lld >/dev/null 2>&1; then
            ln -sf "$(command -v ld.lld)" "$HOME/tmp-ld/aarch64-linux-gnu-ld"
          fi
          echo "$HOME/tmp-ld" >> "$GITHUB_PATH"

      - name: Provide device kernel (from repo or releases)
        id: provide_kernel
        run: |
          mkdir -p upstream-kernel/out/device-kernel
          if [ -f "./device-kernel/device-kernel.img" ]; then
            echo "Found device kernel in repo at ./device-kernel/device-kernel.img"
            cp ./device-kernel/device-kernel.img upstream-kernel/out/device-kernel/device-kernel.img
            echo "source=repo" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Looking for release asset device-kernel.img"
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          ASSET_URL=$(curl -s "$API_URL" | jq -r '.assets[] | select(.name == "device-kernel.img") | .url' || true)
          if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
            echo "Downloading release asset..."
            curl -L \
              -H "Accept: application/octet-stream" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o upstream-kernel/out/device-kernel/device-kernel.img \
              "$ASSET_URL"
            echo "source=release" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No device kernel provided (repo or release). Continuing without it."

      - name: Configure kernel (defconfig)
        run: |
          cd upstream-kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Try device-specific defconfigs in order of preference
          for cfg in vendor/genevn_defconfig vendor/parrot_defconfig genevn_defconfig parrot_defconfig; do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              echo "Using defconfig: $cfg"
              make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "$cfg"
              exit 0
            fi
          done
          # Fall back: list available configs and pick the first one
          echo "Device-specific defconfig not found. Available arm64 configs:"
          ls arch/arm64/configs/ | head -20
          FIRST_CFG=$(ls arch/arm64/configs/ | grep defconfig | head -1)
          if [ -n "$FIRST_CFG" ]; then
            echo "Falling back to: $FIRST_CFG"
            make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "$FIRST_CFG"
          else
            echo "No defconfig found, using bare defconfig"
            make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          fi

      - name: Build kernel (Image.gz, dtbs, modules)
        run: |
          cd upstream-kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache aarch64-linux-gnu-gcc" \
            Image.gz dtbs modules 2>&1 | tee build.log
          ccache -s

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: upstream-kernel/build.log

      - name: Upload build artifacts (out directory)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: upstream-kernel/out

      - name: Upload provided device kernel (if present)
        if: steps.provide_kernel.outputs.source != ''
        uses: actions/upload-artifact@v4
        with:
          name: device-kernel
          path: upstream-kernel/out/device-kernel/device-kernel.img
