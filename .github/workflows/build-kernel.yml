name: build-motorola-kernel

on:
  workflow_dispatch:
            - name: Setup .NET Core SDK
  uses: actions/setup-dotnet@v5.0.1
  with:
    # Optional SDK version(s) to use. If not provided, will install global.json version when available. Examples: 2.2.104, 3.1, 3.1.x, 3.x, 6.0.2xx
    dotnet-version: # optional
    # Optional quality of the build. The possible values are: daily, signed, validated, preview, ga.
    dotnet-quality: # optional
    # Optional global.json location, if your global.json isn't located in the root of the repo.
    global-json-file: # optional
    # Optional package source for which to set up authentication. Will consult any existing NuGet.config in the root of the repo and provide a temporary NuGet.config using the NUGET_AUTH_TOKEN environment variable as a ClearTextPassword
    source-url: # optional
    # Optional OWNER for using packages from GitHub Package Registry organizations/users other than the current repository's owner. Only used if a GPR URL is also provided in source-url
    owner: # optional
    # Optional NuGet.config location, if your NuGet.config isn't located in the root of the repo.
    config-file: # optional
    # Optional input to enable caching of the NuGet global-packages folder
    cache: # optional
    # Used to specify the path to a dependency file: packages.lock.json. Supports wildcards or a list of file names for caching multiple dependencies.
    cache-dependency-path: # optional
          
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
            - name: Setup Go environment
  uses: actions/setup-go@v5.6.0
  with:
    # The Go version to download (if necessary) and use. Supports semver spec and ranges. Be sure to enclose this option in single quotation marks.
    go-version: # optional
    # Path to the go.mod or go.work file.
    go-version-file: # optional
    # Set this option to true if you want the action to always check for the latest available version that satisfies the version spec
    check-latest: # optional
    # Used to pull Go distributions from go-versions. Since there's a default, this is typically not supplied by the user. When running this action on github.com, the default value is sufficient. When running on GHES, you can pass a personal access token for github.com if you are experiencing rate limiting.
    token: # optional, default is ${{ github.server_url == 'https://github.com' && github.token || '' }}
    # Used to specify whether caching is needed. Set to true, if you'd like to enable caching.
    cache: # optional, default is true
    # Used to specify the path to a dependency file - go.sum
    cache-dependency-path: # optional
    # Target architecture for Go to use. Examples: x86, x64. Will use system architecture by default.
    architecture: # optional
          
    steps:
      - name: Checkout (workflow repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libncurses-dev zlib1g-dev \
            git curl jq python3 python3-distutils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld llvm

      - name: Clone Motorola kernel at tag
        run: |
          git clone --depth 1 --branch MMI-T1TGNS33.60-41-2-7 https://github.com/MotorolaMobilityLLC/kernel-msm.git upstream-kernel

      - name: Prepare linker wrapper
        run: |            - name: Setup .NET Core SDK
  uses: actions/setup-dotnet@v5.0.1
  with:
    # Optional SDK version(s) to use. If not provided, will install global.json version when available. Examples: 2.2.104, 3.1, 3.1.x, 3.x, 6.0.2xx
    dotnet-version: # optional
    # Optional quality of the build. The possible values are: daily, signed, validated, preview, ga.
    dotnet-quality: # optional
    # Optional global.json location, if your global.json isn't located in the root of the repo.
    global-json-file: # optional
    # Optional package source for which to set up authentication. Will consult any existing NuGet.config in the root of the repo and provide a temporary NuGet.config using the NUGET_AUTH_TOKEN environment variable as a ClearTextPassword
    source-url: # optional
    # Optional OWNER for using packages from GitHub Package Registry organizations/users other than the current repository's owner. Only used if a GPR URL is also provided in source-url
    owner: # optional
    # Optional NuGet.config location, if your NuGet.config isn't located in the root of the repo.
    config-file: # optional
    # Optional input to enable caching of the NuGet global-packages folder
    cache: # optional
    # Used to specify the path to a dependency file: packages.lock.json. Supports wildcards or a list of file names for caching multiple dependencies.
    cache-dependency-path: # optional
          
          mkdir -p ~/tmp-ld
          if [ -x /usr/bin/aarch64-linux-gnu-ld ]; then
            ln -sf /usr/bin/aarch64-linux-gnu-ld ~/tmp-ld/aarch64-linux-gnu-ld
          elif command -v ld.lld >/dev/null 2>&1; then
            ln -sf "$(command -v ld.lld)" ~/tmp-ld/aarch64-linux-gnu-ld
          fi
          export PATH=~/tmp-ld:$PATH

      - name: Provide device kernel (from repo or releases)
        id: provide_kernel
        run: |
          mkdir -p upstream-kernel/out/device-kernel
          if [ -f "./device-kernel/device-kernel.img" ]; then
            echo "Found device kernel in repo at ./device-kernel/device-kernel.img"
            cp ./device-kernel/device-kernel.img upstream-kernel/out/device-kernel/device-kernel.img
            echo "source=repo" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Looking for release asset device-kernel.img"
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          ASSET_URL=$(curl -s "$API_URL" | jq -r '.assets[] | select(.name == "device-kernel.img") | .url' || true)
          if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
            echo "Downloading release asset..."
            curl -L -H "Accept: application/octet-stream" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o upstream-kernel/out/device-kernel/device-kernel.img "$ASSET_URL"
            echo "source=release" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "No device kernel provided (repo or release). Continuing without it." >> $GITHUB_OUTPUT

      - name: Build kernel (Image.gz, dtbs, modules)
        run: |
          cd upstream-kernel
          export PATH=~/tmp-ld:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) O=out Image.gz dtbs modules 2>&1 | tee build.log || true

      - name: Upload build.log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: upstream-kernel/build.log

      - name: Upload build artifacts (out directory)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: upstream-kernel/out

      - name: Upload provided device kernel (if present)
        if: steps.provide_kernel.outputs.source != ''
        uses: actions/upload-artifact@v4
        with:
          name: device-kernel
          path: upstream-kernel/out/device-kernel/device-kernel.imgEOF
            - name: SecureStack Secrets Analysis
  # You may pin to the exact commit or the version.
  # uses: SecureStackCo/actions-secrets@68f5dca939e2bf6b627449bd5c00f1bb423b01ca
  uses: SecureStackCo/actions-secrets@v0.1.3
  with:
    # SecureStack API key - generate one at https://app.securestack.com
    securestack_api_key: 
    # SecureStack Application ID - available when viewing applications at https://app.securestack.com
    securestack_app_id: 
    # Severities lower than this input value will not be reported; value should be one of: critical | high | medium | low
    severity: 
    # Optional flags for the bloodhound-cli secrets command - run bloodhound-cli code --help for more details.
    flags: # optional, default is 
          
