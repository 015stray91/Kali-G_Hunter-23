name: Collect Device & Kernel Configs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'ci/**'
    paths:
      - 'scripts/collect-device-configs.sh'
      - '.github/workflows/collect-device-configs.yml'

jobs:
  collect-configs:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates xz-utils

      - name: Run device config collection script
        run: |
          bash ./scripts/collect-device-configs.sh

      - name: Display collection summary
        if: always()
        run: |
          if [ -f device-configs/COLLECTION_SUMMARY.txt ]; then
            echo "=== Collection Summary ==="
            cat device-configs/COLLECTION_SUMMARY.txt
          fi
          if [ -f device-configs/manifest.txt ]; then
            echo ""
            echo "=== Manifest ==="
            cat device-configs/manifest.txt
          fi

      - name: Upload device configs artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-configs
          path: device-configs/
          retention-days: 30
          if-no-files-found: error

      - name: Upload kernel tarball
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-tarball
          path: kernel.tar.xz
          retention-days: 30
          if-no-files-found: warn
